<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Countdown to September 9, 2026 at midnight Pacific time.">
    <title>Countdown</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7ede5;
        --navy: #273f67;
        --navy-soft: #536481;
        --gold: #b58a4e;
        --gold-soft: rgba(181, 138, 78, 0.38);
        --terracotta: #b86d55;
        --ink: #392f26;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
      }

      body {
        background:
          radial-gradient(circle at 11% 86%, rgba(184, 109, 85, 0.07), transparent 21rem),
          linear-gradient(115deg, transparent 0 49.8%, rgba(181, 138, 78, 0.035) 50%, transparent 50.2%),
          var(--paper);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        background-image:
          repeating-linear-gradient(0deg, rgba(94, 69, 43, 0.018) 0 1px, transparent 1px 4px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 5px);
        content: "";
        inset: 0;
        mix-blend-mode: multiply;
        opacity: 0.65;
        pointer-events: none;
        position: fixed;
        z-index: 3;
      }

      .constellation {
        height: 190px;
        opacity: 0.38;
        pointer-events: none;
        position: fixed;
        width: 250px;
        z-index: 0;
      }

      .constellation::before,
      .constellation::after {
        content: "";
        position: absolute;
      }

      .constellation::before {
        background:
          radial-gradient(circle at 9% 71%, var(--navy-soft) 0 3px, transparent 4px),
          radial-gradient(circle at 35% 30%, var(--navy-soft) 0 4px, transparent 5px),
          radial-gradient(circle at 65% 44%, var(--navy-soft) 0 3px, transparent 4px),
          radial-gradient(circle at 93% 10%, transparent 0 3px, var(--navy-soft) 4px 5px, transparent 6px);
        inset: 0;
      }

      .constellation::after {
        border-top: 1px dashed rgba(39, 63, 103, 0.3);
        height: 95px;
        left: 20px;
        top: 102px;
        transform: rotate(-12deg);
        width: 220px;
      }

      .constellation--north {
        left: -28px;
        top: 8px;
        transform: rotate(-8deg);
      }

      .constellation--south {
        bottom: -30px;
        right: -30px;
        transform: rotate(172deg);
      }

      .back {
        align-items: center;
        color: var(--navy);
        display: inline-flex;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.72rem;
        gap: 0.6rem;
        left: clamp(20px, 3vw, 44px);
        letter-spacing: 0.18em;
        padding: 8px 0;
        position: fixed;
        text-decoration: none;
        text-transform: uppercase;
        top: clamp(16px, 3vw, 34px);
        transition: color 180ms ease;
        z-index: 5;
      }

      .back::before {
        background: var(--terracotta);
        content: "";
        height: 1px;
        transition: width 180ms ease;
        width: 24px;
      }

      .back:hover,
      .back:focus-visible {
        color: var(--terracotta);
      }

      .back:hover::before,
      .back:focus-visible::before {
        width: 34px;
      }

      .back:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 5px;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(72px, 8vh, 108px) 24px clamp(34px, 6vh, 72px);
        place-items: center;
        position: relative;
        z-index: 1;
      }

      .countdown {
        text-align: center;
        width: min(980px, 100%);
      }

      .emblem {
        height: 214px;
        margin: 0 auto 8px;
        overflow: hidden;
        position: relative;
        width: 300px;
      }

      .emblem img {
        height: auto;
        left: 50%;
        max-width: none;
        position: absolute;
        top: -40px;
        transform: translateX(-50%);
        width: 860px;
      }

      .ornament {
        align-items: center;
        color: var(--gold);
        display: flex;
        font-size: 1rem;
        gap: 12px;
        justify-content: center;
        line-height: 1;
        margin: 6px auto 25px;
        width: min(220px, 65%);
      }

      .ornament::before,
      .ornament::after {
        background: linear-gradient(90deg, transparent, var(--gold));
        content: "";
        height: 1px;
        width: 72px;
      }

      .ornament::after {
        background: linear-gradient(90deg, var(--gold), transparent);
      }

      .digits {
        background: rgba(255, 251, 245, 0.42);
        border-block: 1px solid var(--gold-soft);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin: 0 auto;
        position: relative;
      }

      .digits::before,
      .digits::after {
        color: var(--gold);
        content: "◆";
        font-size: 0.62rem;
        line-height: 1;
        position: absolute;
        top: 0;
        transform: translateY(-50%) rotate(45deg);
      }

      .digits::before {
        left: -4px;
      }

      .digits::after {
        right: -4px;
      }

      .unit {
        padding: clamp(25px, 4.5vw, 46px) 12px clamp(22px, 3.5vw, 34px);
        position: relative;
      }

      .unit + .unit::before {
        background: linear-gradient(transparent, var(--gold-soft), transparent);
        bottom: 17%;
        content: "";
        left: 0;
        position: absolute;
        top: 17%;
        width: 1px;
      }

      .number {
        color: var(--navy);
        display: block;
        font-family: Didot, "Bodoni 72", "Bodoni MT", Georgia, serif;
        font-size: clamp(3rem, 8.2vw, 6.4rem);
        font-variant-numeric: lining-nums tabular-nums;
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.9;
      }

      .name {
        color: var(--gold);
        display: block;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        margin-top: 17px;
        text-transform: uppercase;
      }

      .date {
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.76rem;
        letter-spacing: 0.16em;
        margin-top: 27px;
        text-transform: uppercase;
      }

      .pulse {
        animation: pulse 1.8s ease-in-out infinite;
        background: var(--terracotta);
        border: 1px solid rgba(184, 109, 85, 0.28);
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(184, 109, 85, 0.1);
        display: inline-block;
        height: 7px;
        margin: 0 12px 1px 0;
        width: 7px;
      }

      .countdown.is-complete .pulse {
        background: var(--navy);
        border-color: rgba(39, 63, 103, 0.25);
        box-shadow: 0 0 0 4px rgba(39, 63, 103, 0.09);
      }

      .sr-only {
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      @keyframes pulse {
        50% {
          opacity: 0.42;
          transform: scale(0.78);
        }
      }

      @media (max-width: 620px) {
        main {
          padding-inline: 18px;
        }

        .constellation {
          opacity: 0.2;
        }

        .emblem {
          height: 169px;
          width: 230px;
        }

        .emblem img {
          top: -32px;
          width: 680px;
        }

        .ornament {
          margin-bottom: 21px;
        }

        .digits {
          grid-template-columns: repeat(2, 1fr);
        }

        .unit:nth-child(3),
        .unit:nth-child(4) {
          border-top: 1px solid var(--gold-soft);
        }

        .unit:nth-child(3)::before {
          display: none;
        }

        .number {
          font-size: clamp(3.2rem, 18vw, 4.8rem);
        }

        .date {
          line-height: 1.7;
        }
      }

      @media (max-height: 720px) and (min-width: 621px) {
        main {
          padding-block: 58px 28px;
        }

        .emblem {
          height: 158px;
          width: 230px;
        }

        .emblem img {
          top: -31px;
          width: 660px;
        }

        .ornament {
          margin-bottom: 16px;
        }

        .unit {
          padding-block: 25px 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }

        .back,
        .back::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="constellation constellation--north" aria-hidden="true"></div>
    <div class="constellation constellation--south" aria-hidden="true"></div>
    <a class="back" href="index.html">Article</a>
    <main>
      <section class="countdown" aria-labelledby="countdown-title">
        <h1 id="countdown-title" class="sr-only">Countdown</h1>
        <div class="emblem" role="img" aria-label="Blindfolded figure holding a cornucopia">
          <img src="website/fortuna-brand-reference.jpg" alt="">
        </div>
        <div class="ornament" aria-hidden="true">✦</div>
        <div
          class="digits"
          role="timer"
          aria-label="Countdown to September 9, 2026 at midnight Pacific time"
        >
          <div class="unit">
            <span class="number" id="days">00</span>
            <span class="name">Days</span>
          </div>
          <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="name">Hours</span>
          </div>
          <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="name">Minutes</span>
          </div>
          <div class="unit">
            <span class="number" id="seconds">00</span>
            <span class="name">Seconds</span>
          </div>
        </div>
        <div class="date"><span class="pulse"></span>Wed · 09 Sep 2026 · 00:00 PT</div>
      </section>
    </main>
    <script>
      const target = new Date("2026-09-09T00:00:00-07:00");
      const countdown = document.querySelector(".countdown");
      const parts = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };

      function updateCountdown() {
        const remaining = Math.max(0, target.getTime() - Date.now());
        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor(remaining / 3600000) % 24;
        const minutes = Math.floor(remaining / 60000) % 60;
        const seconds = Math.floor(remaining / 1000) % 60;

        parts.days.textContent = String(days).padStart(2, "0");
        parts.hours.textContent = String(hours).padStart(2, "0");
        parts.minutes.textContent = String(minutes).padStart(2, "0");
        parts.seconds.textContent = String(seconds).padStart(2, "0");

        if (remaining === 0) {
          countdown.classList.add("is-complete");
        }
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>

# @package _global_
# Thompson tree search on binned beliefs with the weighted-sum backup.
# Compose with a board recipe: --config-name hex6 +algorithm=binned
model:
  network: aznet_binned
  bins:
    # Odd number of evenly spaced atoms on [0, 1], including 0, 0.5 and 1.
    count: 9

selfplay:
  search:
    kind: binned_thompson
    binned_thompson:
      num_simulations: 32
      max_depth: 32
      root_policy_support: search_evidence
      policy_target_temperature: 1.0
      # xla; cuda for the same backup as one CUDA kernel (scacchi/native_binned);
      # fused for the whole search step as one kernel per simulation (Hex only,
      # same trees as cuda).
      backup_kernel: xla
      # backup_kernel=fused only: 2 overlaps half the lanes' network with the
      # other half's tree step; see scacchi/types.py for when trees stay identical.
      fused_cohorts: 1
      # xla (flax) or cuda (scacchi/native_binned/network.cu, same precision).
      network_kernel: xla
  action_commitment:
    posterior_update: null

eval:
  player_search:
    kind: binned_thompson
    binned_thompson:
      num_simulations: 32
      max_depth: 32
      root_policy_support: search_evidence
      backup_kernel: ${selfplay.search.binned_thompson.backup_kernel}
      fused_cohorts: 1
      network_kernel: ${selfplay.search.binned_thompson.network_kernel}
  player_action_commitment:
    posterior_update: null

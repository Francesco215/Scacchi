# @package _global_
# Thompson tree search on binned beliefs with the weighted-sum backup.
# Compose with a board recipe: --config-name hex6 +algorithm=binned
model:
  network: aznet_binned
  bins:
    # Odd number of evenly spaced atoms on [0, 1], including 0, 0.5 and 1.
    count: 9

selfplay:
  search:
    kind: binned_thompson
    binned_thompson:
      num_simulations: 32
      max_depth: 32
      root_policy_support: search_evidence
      policy_target_temperature: 1.0
      # auto: fused on Hex, else cuda, with a CUDA GPU and nvcc; xla otherwise.
      # fused: the whole search step as one CUDA kernel per simulation (Hex only);
      # cuda: JAX search with the backup as one CUDA kernel (same trees as fused);
      # xla: all JAX. See scacchi/types.py.
      search_kernel: auto
      # search_kernel=fused only: 2 overlaps half the lanes' network with the
      # other half's tree step; see scacchi/types.py for when trees stay identical.
      fused_cohorts: 1
      # xla (flax), cuda (scacchi/native_binned/network.cu, same precision), or
      # fp8 (same kernels, residual convolutions on e4m3; search only, training stays bf16).
      network_kernel: xla
  action_commitment:
    posterior_update: null

eval:
  player_search:
    kind: binned_thompson
    binned_thompson:
      num_simulations: 32
      max_depth: 32
      root_policy_support: search_evidence
      search_kernel: ${selfplay.search.binned_thompson.search_kernel}
      fused_cohorts: 1
      network_kernel: ${selfplay.search.binned_thompson.network_kernel}
  player_action_commitment:
    posterior_update: null

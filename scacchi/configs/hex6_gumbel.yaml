# Current-schema port of origin/main scacchi/configs/alphazero_hex.yaml.
# This is the legacy 6x6 scalar Boardlaw Gumbel AlphaZero recipe.

run:
  seed: 890
  max_num_iters: 100

env:
  id: hex
  board_size: 6
  num_outcomes: null

model:
  network: boardlaw
  num_channels: 128
  num_layers: 8
  resnet_v2: true
  rezero_kernel_init: orthogonal

selfplay:
  batch_size: 8192
  max_num_steps: 32
  action_commitment_type: search_action
  search:
    kind: gumbel
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

training:
  batch_size: 1024
  learning_rate: 3e-3
  grad_clip_norm: 1.0

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 0.0
    q_dir_kl_weight: 0.0
    value_outcome_weight: 0.0
    q_outcome_weight: 0.0
    loss_mask_mode: value
    policy_target_mode: search

  regularization:
    dirichlet_concentration_clip: 100.0

eval:
  interval: 1
  batch_size: 256
  baseline: checkpoint
  player_action_commitment_type: search_action
  baseline_action_commitment_type: search_action
  player_search:
    kind: gumbel
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true
  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 0
  save_interval_steps: 50

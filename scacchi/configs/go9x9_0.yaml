# PGX Go 9x9 Gumbel AlphaZero recipe on the current Scacchi runtime.
# Matches the paper-level hyperparameters where this repo exposes the knob.

run:
  seed: 1
  max_num_iters: 400

env:
  id: go_9x9
  board_size: 9
  num_outcomes: 3

model:
  network: aznet_dirichlet
  num_channels: 128
  num_layers: 6
  resnet_v2: true

selfplay:
  batch_size: 1024
  max_num_steps: 256
  action_commitment_type: posterior_sample
  
  search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 4
      num_blocks: 8
      max_depth: 64
      constants:
        kappa_leaf: 1.0
        kappa_terminal: 80.0
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: false


training:
  batch_size: 4096
  max_updates_per_iter: null
  learning_rate: 3e-3
  grad_clip_norm: null

  losses:
    policy_weight: 4.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 0.0
    q_outcome_weight: 0.0
    q_loss_weight_mode: evidence_mass
    q_dir_kl_reduction: masked_mean
    loss_mask_mode: value
    policy_target_mode: search
    terminal_edge_targets: true
    terminal_parent_targets: true
    
  regularization:
    dirichlet_concentration_clip: 100.0
    
eval:
  interval: 1
  batch_size: 1024
  baseline: pgx
  baseline_id: go_9x9_v0
  player_action_commitment_type: search_action
  baseline_action_commitment_type: search_action
  
  player_search:
    kind: policy
    dirichlet_thompson:
      num_simulations: 4
      num_blocks: 8
      constants:
        kappa_leaf: 1.0
        kappa_terminal: 8.0
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: false
    policy:
      temperature: 1.0
      
  baseline_search:
    kind: policy
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: false
    policy:
      temperature: 1.0

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 0
  save_interval_steps: 50

# From-scratch Hex6 integration recipe for guarded Q21 plus cubic commitment.
# It keeps the mctx branch's other training defaults to isolate this code path;
# it is not an exact reproduction of the historical E12/Muon experiment.

run:
  seed: 9105
  # Include step 200 and retain enough checkpoints for a real learning curve.
  max_num_iters: 201

env:
  id: hex
  board_size: 6
  # Hex has no draw, which enables the guarded binary prefix-CDF estimator.
  num_outcomes: 2

model:
  network: boardlaw_dirichlet
  num_channels: 128
  num_layers: 8
  compute_dtype: bfloat16
  resnet_v2: true
  # Start from a symmetric low-evidence binary prior, then learn its mass.
  # Unlike the old calibrated runs, this is a low floor rather than a fixed C.
  dirichlet_concentration_floor: 3.0
  dirichlet_initial_concentration: 3.1

selfplay:
  batch_size: 4096
  max_num_steps: 64
  # Sample the searched posterior policy during self-play so independent games
  # keep exploring; evaluation still commits its deterministic argmax below.
  action_commitment_type: posterior_sample
  search:
    kind: dirichlet_thompson
    # Sample once from q(a)^3 instead of running a second vote population.
    posterior_sample_temperature: 0.3333333333333333
    dirichlet_thompson:
      # Keep the corrected persistent tree small enough for a true speedrun.
      # The DT128 trial learned, but was ~11x slower per iteration than the
      # old 32-expansion reference and therefore spent its compute poorly.
      num_simulations: 32
      kappa: 4.0
      policy_samples: 32
      # Q21 is primary; this budget is used only by the native safety fallback.
      posterior_policy_samples: 8
      policy_sample_chunk_size: 32
      # Q21 is used independently for cache repair, the replay target, and
      # the ephemeral action policy. Every unsafe estimate falls back native.
      posterior_policy_estimator: prefix_cdf
      root_policy_target_estimator: prefix_cdf
      root_action_estimator: prefix_cdf
      prefix_cdf_half_width: 10
      prefix_cdf_tail_scale: 8.0
      prefix_cdf_min_half_range: 6.0
      prefix_cdf_max_half_range: 11.0

training:
  batch_size: 1024
  learning_rate: 1e-3
  grad_clip_norm: 1.0
  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 1.0
    q_outcome_weight: 1.0
    q_loss_weight_mode: evidence_mass
    q_dir_kl_reduction: masked_mean
    # Full KL is intentional: mean-only KL has exactly zero concentration
    # gradient on unresolved Dirichlet targets.
    dirichlet_loss_mode: full
    loss_mask_mode: value
    terminal_edge_targets: true
    terminal_parent_targets: true
    policy_target_mode: search
    categorical_epsilon: 0.01
  regularization:
    # A broad ceiling regularizes categorical density without pinning the
    # unresolved state-dependent concentration learned by the model.
    dirichlet_concentration_clip: 16.0

eval:
  interval: 5
  batch_size: 512
  baseline: checkpoint
  player_action_commitment_type: posterior_argmax
  baseline_action_commitment_type: posterior_argmax
  player_search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 32
      kappa: 4.0
      policy_samples: 32
      posterior_policy_samples: 32
      policy_sample_chunk_size: 32
      posterior_policy_estimator: prefix_cdf
      root_policy_target_estimator: prefix_cdf
      root_action_estimator: prefix_cdf
      prefix_cdf_half_width: 10
      prefix_cdf_tail_scale: 8.0
      prefix_cdf_min_half_range: 6.0
      prefix_cdf_max_half_range: 11.0
  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 4

logging:
  interval: 1
  wandb:
    # All training runs from this recipe are logged externally.
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 9
  save_interval_steps: 25
  directory: checkpoints/hex6_q21_temperature3_seed9105

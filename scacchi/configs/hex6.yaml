run:
  max_num_iters: 500

env:
  id: hex
  board_size: 6
  num_outcomes: 3

model:
  network: boardlaw_dirichlet
  num_channels: 256
  num_layers: 8
  compute_dtype: float32
  resnet_v2: true

selfplay:
  batch_size: 8192
  max_num_steps: 25
  action_commitment_type: posterior_argmax
  search:
    kind: dirichlet_thompson

    dirichlet_thompson:
      num_simulations: 16
      kappa: 3.
      policy_samples: 32


training:
  batch_size: 2048
  learning_rate: 2e-3
  grad_clip_norm: 10.0
  optimizer: muon

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 0.1
    q_outcome_weight: 0.1
    terminal_edge_targets: true
    terminal_parent_targets: true
    policy_target_mode: search
    categorical_epsilon: 0.01

  regularization:
    dirichlet_concentration_clip: 8.0

eval:
  interval: 5
  batch_size: 256
  baseline: checkpoint
  player_search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 32
      kappa: 3.
      policy_samples: 32
  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 4

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 0
  # Keep recovery distance small on workstations with a GPU watchdog.
  save_interval_steps: 10
  # Never resume the stale checkpoint produced by an earlier implementation.
  directory: checkpoints/asd


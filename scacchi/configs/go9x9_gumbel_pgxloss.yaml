# Reproduce the pgx alphazero report loss curves: identical recipe but with
# loss_mask_mode=pgx (their exact loss: unmasked full-softmax policy CE,
# value mean(l2*mask)). 400 iters = 105M frames = the report x-axis.

run:
  seed: 1
  max_num_iters: 400

env:
  id: go_9x9
  board_size: 9
  num_outcomes: 3

model:
  network: aznet
  num_channels: 128
  num_layers: 6
  resnet_v2: true

selfplay:
  batch_size: 1024
  max_num_steps: 256
  action_commitment_type: search_action
  search:
    kind: gumbel
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

training:
  batch_size: 4096
  max_updates_per_iter: null
  learning_rate: 1e-3
  grad_clip_norm: null

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 0.0
    q_dir_kl_weight: 0.0
    value_outcome_weight: 0.0
    q_outcome_weight: 0.0
    policy_target_mode: search
    loss_mask_mode: pgx

eval:
  interval: 5
  batch_size: 1024
  baseline: pgx
  baseline_id: go_9x9_v0
  player_action_commitment_type: posterior_sample
  baseline_action_commitment_type: posterior_sample
  player_search:
    kind: policy
    policy:
      temperature: 1.0
  baseline_search:
    kind: policy
    policy:
      temperature: 1.0

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

# NOTE: orbax multihost saves crash against stale 0.orbax-checkpoint-tmp dirs
# left in checkpoints/go_9x9_bs9_aznet_c128_l6_seed1 on the pod workers;
# checkpointing stays off until those are cleaned.
checkpointing:
  max_to_keep: 0
  directory: checkpoints/go9x9_diag_snapshots_v2
  save_interval_steps: 50

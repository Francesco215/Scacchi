# Posterior-tree reference config:
# The old Python wavefront backend has been removed from scacchi/dirichlet_tree.
# Keep this on the slower object posterior_tree path until the Rust dqaz backend
# described in plan.md is wired into training.
# Action-selection symbols are explicit enum values. Use posterior_argmax or
# posterior_sample where those modes are accepted; there is no posterior_mean mode.

run:
  seed: 0  # Random seed for model init, self-play, and search sampling.
  max_num_iters: 80  # Training budget, below the requested 100-step cap.

env:
  id: hex  # PGX environment id.
  board_size: 5  # Hex board side length.
  num_outcomes: 3  # WDL outcome dimension for Dirichlet value/Q heads.

model:
  network: boardlaw_dirichlet  # Network architecture with policy, value-Dirichlet, and Q-Dirichlet heads.
  num_channels: 512  # Hidden width.
  num_layers: 8  # ReZero residual depth.
  resnet_v2: true  # Ignored by Boardlaw models, kept for schema consistency.

selfplay:
  batch_size: 4096  # Number of games advanced in parallel.
  max_num_steps: 25  # 5x5 Hex has at most 25 placements.
  action_source: posterior_sample  # Self-play action source: posterior_argmax/posterior_best, posterior_sample, or search_action.

search:
  policy: dirichlet_thompson  # Reference Python posterior-tree path; Rust dqaz will replace it.
  num_simulations: 32  # Posterior-tree leaf-request budget per root.
  num_blocks: 8  # Compatibility knob for dirichlet_thompson; kept so older overrides still parse.
  eval_batch_size: 1024  # Maximum neural leaf evaluations per batch.
  inflight_limit: 1  # Legacy object posterior_tree request limit.

  monte_carlo:
    policy_samples: 64  # Samples used to estimate posterior-best policy targets.
    backup_samples: 4  # Samples used by posterior-tree backup/target approximations where applicable.

  leaf_value_mode: alpha  # alpha preserves value-head concentration; mean uses kappa_leaf * mean(alpha).

  constants:
    kappa_leaf: 1.0  # Fixed concentration for leaf_value_mode: mean; alpha mode preserves network concentration.
    kappa_terminal: 8.0  # Legacy terminal Dirichlet mass; native categorical terminal leaves should not rely on this.
    epsilon_terminal: 5e-2  # Legacy terminal Dirichlet smoothing; categorical targets use categorical_epsilon in the loss.
    state_posterior_kappa_n: 16.0  # Half-trust count for blending neural value priors with downstream search evidence.

training:
  batch_size: 1024  # Learner minibatch size; multiple updates per fresh self-play batch.
  replay_buffer_size: 1  # Train on the latest self-play batch only.
  learning_rate: 1e-3  # Adam learning rate used by solved scalar Boardlaw runs.
  grad_clip_norm: 1.0  # Keep Dirichlet-head fine tuning stable.

  losses:
    policy_weight: 0.05  # Keep noisy early policy targets auxiliary during bootstrap.
    value_dir_kl_weight: 5.0  # Keep the WDL state posterior as a primary signal.
    q_dir_kl_weight: 5.0  # Keep action-Q posteriors as a primary signal.
    policy_target_mode: search  # Use the search-improved policy target.

  regularization:
    dirichlet_concentration_clip: 8.0  # Bound Dirichlet confidence during fine tuning.

eval:
  interval: 1  # Evaluate often enough to monitor convergence without dominating runtime.
  batch_size: 512  # Number of evaluation games run in parallel.

logging:
  interval: 1  # Log training metrics every N iterations.
  wandb:
    enabled: false
    project: scacchi-az

checkpointing:
  max_to_keep: 0  # Number of checkpoints to retain; 0 disables retention.
  save_interval_steps: 50  # Save checkpoint every N iterations when retention is enabled.

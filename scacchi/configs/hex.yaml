run:
  seed: 0  # Random seed for model init, self-play, and search sampling.
  max_num_iters: 80  # Training budget, below the requested 100-step cap.

env:
  id: hex  # PGX environment id.
  board_size: 5  # Hex board side length.
  num_outcomes: 3  # WDL outcome dimension for Dirichlet value/Q heads.

model:
  network: boardlaw_dirichlet  # Network architecture with policy, value-Dirichlet, and Q-Dirichlet heads.
  num_channels: 512  # Hidden width.
  num_layers: 8  # ReZero residual depth.
  resnet_v2: true  # Ignored by Boardlaw models, kept for schema consistency.

selfplay:
  batch_size: 4096  # Number of games advanced in parallel.
  max_num_steps: 25  # 5x5 Hex has at most 25 placements.
  action_source: posterior_argmax  # Commit the posterior-best action after search.

search:
  policy: gumbel  # Fast Gumbel search using the Dirichlet model's WDL value adapter.
  num_simulations: 32  # MCTS simulations per root.
  num_blocks: 8  # Deprecated: Search blocks for non-wavefront Dirichlet search paths.
  eval_batch_size: 1024  # Unused by this Gumbel driver.
  inflight_limit: 1  # Unused by this Gumbel driver.

  monte_carlo:
    policy_samples: 64  # Samples used to estimate posterior-best policy targets.
    backup_samples: 4  # Unused by Gumbel search.

  leaf_value_mode: alpha  # Unused by this Gumbel driver.

  constants:
    kappa_leaf: 1.0  # Unused by this Gumbel driver.
    kappa_terminal: 8.0  # Unused by this Gumbel driver.
    epsilon_terminal: 5e-2  # Unused by this Gumbel driver.
    state_posterior_kappa_n: 16.0  # Unused by this Gumbel driver.

  wavefront:
    backend: arena  # Unused by this Gumbel driver.
    num_lanes_per_root: 1  # Unused by this Gumbel driver.
    max_depth: 128  # Unused by this Gumbel driver.
    final_action_mode: posterior_sample  # Unused by this Gumbel driver.
    pad_eval_batches: true  # Unused by this Gumbel driver.
    pad_jax_select: false  # Unused by this Gumbel driver.
    np_select_below: 1024  # Unused by this Gumbel driver.
    grouped_expansion: true  # Unused by this Gumbel driver.
    lane_indexed_step: true  # Unused by this Gumbel driver.
    stable_lane_batch: true  # Unused by this Gumbel driver.
    pad_pending_observation_gather: true  # Unused by this Gumbel driver.

training:
  batch_size: 1024  # Learner minibatch size; multiple updates per fresh self-play batch.
  replay_buffer_size: 1  # Gumbel path trains on the latest self-play batch.
  learning_rate: 1e-3  # Adam learning rate used by solved scalar Boardlaw runs.
  grad_clip_norm: 1.0  # Keep Dirichlet-head fine tuning stable.

  tree:
    enabled: false  # Posterior-tree row export is only for Dirichlet search.
    include_root: false  # Unused by this Gumbel driver.
    include_terminal: false  # Unused by this Gumbel driver.
    min_q_evidence: 0.0  # Unused by this Gumbel driver.
    max_nodes_per_step: null  # Unused by this Gumbel driver.

  exact_hex_solver:
    enabled: false  # Exact helper is intentionally limited to <=4x4 and disabled for 5x5.
    extra_batch_size: 0  # Unused when exact solver is disabled.

  losses:
    policy_weight: 0.05  # Keep noisy early policy targets auxiliary during bootstrap.
    value_dir_kl_weight: 5.0  # Keep the WDL state posterior as a primary signal.
    q_dir_kl_weight: 5.0  # Keep action-Q posteriors as a primary signal.
    value_outcome_weight: 25.0  # Strongly anchor value WDL means to realized outcomes.
    q_outcome_weight: 10.0  # Strongly anchor played-action Q WDL means to realized outcomes.
    policy_target_mode: search  # Use the search-improved policy target.

  regularization:
    dirichlet_concentration_clip: 8.0  # Bound Dirichlet confidence during fine tuning.

eval:
  interval: 5  # Evaluate often enough to monitor convergence without dominating runtime.
  batch_size: 512  # Number of evaluation games run in parallel.

logging:
  interval: 1  # Log training metrics every N iterations.
  wandb:
    enabled: false  # Keep local verification runs self-contained.
    project: scacchi-az  # Weights & Biases project name.

checkpointing:
  max_to_keep: 0  # Number of checkpoints to retain; 0 disables retention.
  save_interval_steps: 50  # Save checkpoint every N iterations when retention is enabled.

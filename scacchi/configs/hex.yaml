run:
  seed: 0
  max_num_iters: 300

env:
  id: hex
  board_size: 3
  num_outcomes: 3

model:
  network: boardlaw_dirichlet
  num_channels: 64
  num_layers: 4
  resnet_v2: true

selfplay:
  batch_size: 8
  max_num_steps: 2048
  action_source: posterior_sample

search:
  policy: posterior_tree_wavefront
  num_simulations: 4
  num_blocks: 8
  eval_batch_size: 8192
  inflight_limit: 1

  monte_carlo:
    policy_samples: 1
    backup_samples: 1

  leaf_value_mode: alpha

  constants:
    kappa_leaf: 1.0
    kappa_terminal: 8.0
    epsilon_terminal: 1e-6
    state_posterior_kappa_n: 9.0

  wavefront:
    backend: arena
    num_lanes_per_root: 4
    max_depth: 128
    final_action_mode: scalar_q_argmax
    pad_eval_batches: true
    pad_jax_select: false
    np_select_below: 1024
    grouped_expansion: true
    lane_indexed_step: true
    stable_lane_batch: true
    pad_pending_observation_gather: true

training:
  batch_size: 8192
  learning_rate: 3e-3
  grad_clip_norm: 1.0

  tree:
    enabled: true
    include_root: true
    include_terminal: true
    min_q_evidence: 0.0
    max_nodes_per_step: null

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 0.25
    q_outcome_weight: 0.10

  regularization:
    dirichlet_concentration_clip: 100.0

eval:
  interval: 1
  batch_size: 16

logging:
  interval: 1
  wandb:
    enabled: false
    project: scacchi-az

checkpointing:
  max_to_keep: 0
  save_interval_steps: 50

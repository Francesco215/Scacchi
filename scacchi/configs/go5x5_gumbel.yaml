# Go 5x5 with the scalar Gumbel AlphaZero recipe (diagnostic twin of go9x9_gumbel):
# if this learns and 9x9 does not, the 9x9 failure is scale/eval-specific.
# Eval is against a uniform-random baseline so progress is visible immediately.

run:
  seed: 1
  max_num_iters: 200

env:
  id: go
  board_size: 5
  num_outcomes: 3

model:
  network: aznet
  num_channels: 128
  num_layers: 6
  resnet_v2: true

selfplay:
  batch_size: 2048
  max_num_steps: 64
  action_commitment_type: search_action
  search:
    kind: gumbel
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

training:
  batch_size: 8192
  max_updates_per_iter: null
  learning_rate: 1e-3
  grad_clip_norm: null

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 0.0
    q_dir_kl_weight: 0.0
    value_outcome_weight: 0.0
    q_outcome_weight: 0.0
    policy_target_mode: search
    loss_mask_mode: value

eval:
  interval: 5
  batch_size: 1024
  baseline: random
  player_action_commitment_type: search_action
  baseline_action_commitment_type: search_action

  player_search:
    kind: gumbel
    gumbel:
      num_simulations: 32
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 2
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 50
  save_interval_steps: 10

# Prototype config for the algorithms.tex native posterior-tree search.

run:
  seed: 0
  max_num_iters: 80

env:
  id: hex
  board_size: 5
  num_outcomes: 3

model:
  network: boardlaw_dirichlet
  num_channels: 512
  num_layers: 8

selfplay:
  batch_size: 4096
  max_num_steps: 25
  action_source: search_action

search:
  policy: posterior_tree_wavefront
  num_simulations: 32
  eval_batch_size: 1024
  inflight_limit: 4
  max_depth: 25
  final_action_mode: posterior_argmax
  leaf_value_mode: alpha

  monte_carlo:
    policy_samples: 64

  constants:
    state_posterior_kappa_n: 16.0

  categorical:
    epsilon: 0.0001
    draw_rule: policy_prior

training:
  batch_size: 1024
  replay_buffer_size: 1
  learning_rate: 0.001
  grad_clip_norm: 1.0

  losses:
    policy_weight: 0.05
    value_dir_kl_weight: 5.0
    q_dir_kl_weight: 5.0

  regularization:
    dirichlet_concentration_clip: 8.0

eval:
  interval: 1
  batch_size: 512

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 0
  save_interval_steps: 50

# Wide Hex 11 scratch run against the published PGX hex_v0 anchor.

defaults:
  - hex
  - _self_

run:
  max_num_iters: 300

env:
  board_size: 11

model:
  num_channels: 256
  num_layers: 6

selfplay:
  batch_size: 2048
  max_num_steps: 128

eval:
  baseline: pgx
  baseline_id: hex_v0
  baseline_search:
    gumbel:
      num_simulations: 32

checkpointing:
  max_to_keep: 3
  save_interval_steps: 5
  directory: checkpoints/hex11_azdirichlet_c256_l6_kl_t1_dt32_pgx_seed9105

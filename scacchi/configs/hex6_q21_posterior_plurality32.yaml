run:
  seed: 0
  # The fixed stability horizon visits steps 0 through 200 inclusive.
  max_num_iters: 201

env:
  id: hex
  board_size: 6
  num_outcomes: 2

model:
  network: boardlaw_dirichlet
  num_channels: 256
  num_layers: 8
  compute_dtype: float32
  resnet_v2: true
  legacy_dirichlet_head_init: false
  rezero_kernel_init: variance_scaling

selfplay:
  batch_size: 8192
  max_num_steps: 36
  # E11 changes only E10's action commitment: the lowest-index plurality of
  # 32 categorical votes from the same guarded Q21 commitment population.
  action_commitment_type: posterior_plurality
  search:
    kind: dirichlet_thompson
    posterior_plurality_samples: 32

    dirichlet_thompson:
      num_simulations: 32
      max_depth: 32
      kappa: 3.
      policy_samples: 32
      posterior_policy_samples: null
      policy_sample_chunk_size: 32
      posterior_policy_estimator: prefix_cdf
      root_policy_target_estimator: prefix_cdf
      root_action_estimator: prefix_cdf
      prefix_cdf_half_width: 10
      prefix_cdf_tail_scale: 8.0
      prefix_cdf_min_half_range: 6.0
      prefix_cdf_max_half_range: 11.0


training:
  batch_size: 1024
  learning_rate: 2e-3
  grad_clip_norm: 10.0
  optimizer: muon

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 0.1
    q_outcome_weight: 0.1
    terminal_edge_targets: true
    terminal_parent_targets: true
    policy_target_mode: search
    categorical_epsilon: 0.01
    q_dir_kl_reduction: masked_mean
    q_loss_weight_mode: evidence_mass
    dirichlet_loss_mode: full
    loss_mask_mode: search

  regularization:
    dirichlet_concentration_clip: 8.0

eval:
  interval: 5
  batch_size: 256
  baseline: checkpoint
  player_action_commitment_type: posterior_argmax
  baseline_action_commitment_type: posterior_argmax
  player_search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 32
      max_depth: 32
      kappa: 3.
      policy_samples: 32
      posterior_policy_samples: null
      policy_sample_chunk_size: 32
      posterior_policy_estimator: winner_mc
      root_policy_target_estimator: winner_mc
      root_action_estimator: prefix_cdf
      prefix_cdf_half_width: 10
      prefix_cdf_tail_scale: 8.0
      prefix_cdf_min_half_range: 6.0
      prefix_cdf_max_half_range: 11.0
  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 4

logging:
  interval: 1
  jsonl_path: experiments/e11/hex6_q21_posterior_plurality32_s0/metrics.jsonl
  wandb:
    # Preserve all metrics locally until private-metric export is explicitly
    # approved; the run must not silently omit experiment provenance.
    enabled: false
    project: scacchi-az

checkpointing:
  max_to_keep: 9
  save_interval_steps: 25
  directory: checkpoints/hex6_q21_posterior_plurality32_s0

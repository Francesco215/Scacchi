# Go 5x5 with Dirichlet-Thompson search and outcome-grounded Dirichlet targets
# (losses.outcome_dir_targets). CPU-validated recipe, scaled for TPU.
# Eval is against a uniform-random baseline so progress is visible immediately.

run:
  seed: 1
  max_num_iters: 200

env:
  id: go
  board_size: 5
  num_outcomes: 3

model:
  network: aznet_dirichlet
  # Same trunk shape as the go9x9 configs so trunk weights stay transferable.
  num_channels: 128
  num_layers: 6
  resnet_v2: true

selfplay:
  batch_size: 2048
  max_num_steps: 64
  action_commitment_type: search_action
  search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 4
      num_blocks: 8
      constants:
        kappa_leaf: 1.0
        kappa_terminal: 8.0

training:
  batch_size: 8192
  max_updates_per_iter: null
  learning_rate: 1e-3
  grad_clip_norm: null

  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 0.25
    q_outcome_weight: 0.1
    q_loss_weight_mode: evidence_mass
    q_dir_kl_reduction: masked_mean
    loss_mask_mode: value
    terminal_edge_targets: true
    terminal_parent_targets: true
    outcome_dir_targets: true

eval:
  interval: 5
  batch_size: 1024
  baseline: random
  player_action_commitment_type: search_action
  baseline_action_commitment_type: search_action

  player_search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 4
      num_blocks: 8
      constants:
        kappa_leaf: 1.0
        kappa_terminal: 8.0

  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 2
      gumbel_scale: 1.0
      completed_q_value_scale: 0.1
      completed_q_rescale_values: true

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 50
  save_interval_steps: 10

# Effective configuration of W&B run pal/scacchi-az/cl3xe7ka
# ("hex_9_dt_solved"). The run was launched from hex9_dirichlet_scratch
# with run.max_num_iters overridden to 41.
#
# Match the solved run's search-evidence-supported, sharpened replay policy.

run:
  seed: 9105
  max_num_iters: 300

env:
  id: hex
  board_size: 9
  num_outcomes: 2

model:
  network: aznet_dirichlet
  num_channels: 128
  num_layers: 6
  compute_dtype: bfloat16
  resnet_v2: true
  dirichlet_concentration_floor: null
  dirichlet_initial_concentration: 3.1
  legacy_dirichlet_head_init: false
  rezero_kernel_init: variance_scaling

selfplay:
  batch_size: 4096
  max_num_steps: 81
  action_commitment:
    kind: posterior_sample
    posterior_update: numerical
    posterior_sample_temperature: 0.3333333333333333
  search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 32
      max_depth: 32
      root_policy_support: search_evidence
      policy_target_temperature: 0.3333333333333333
      posterior_update:
        kind: numerical
        numerical:
          kappa: 4.0
          half_width: 10
          tail_scale: 8.0
          min_half_range: 6.0
          max_half_range: 11.0
          fallback_policy_samples: 8
          fallback_policy_sample_chunk_size: 32

training:
  batch_size: 1024
  max_updates_per_iter: null
  learning_rate: 1e-3
  lr_decay_after_iters: null
  lr_decay_factor: 1.0
  grad_clip_norm: 1.0
  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 1.0
    q_outcome_weight: 1.0
    q_supervision:
      action_set: positive_search_evidence_or_solved
      reduction: mean_over_selected_state_action_pairs
    dirichlet_loss_mode: full
    loss_mask_mode: value
    terminal_edge_targets: true
    terminal_parent_targets: true
    policy_target_mode: search
    categorical_epsilon: 0.01
  regularization:
    dirichlet_concentration_clip: 16.0

eval:
  interval: 5
  batch_size: 512
  baseline: checkpoint
  baseline_id: null
  checkpoint_path: checkpoints/9_solved
  player_action_commitment:
    kind: posterior_argmax
    posterior_update: numerical
  baseline_action_commitment:
    kind: search_action
  player_search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 32
      max_depth: 32
      root_policy_support: search_evidence
      posterior_update:
        kind: numerical
        numerical:
          kappa: 4.0
          half_width: 10
          tail_scale: 8.0
          min_half_range: 6.0
          max_half_range: 11.0
          fallback_policy_samples: 8
          fallback_policy_sample_chunk_size: 32
  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 4
      gumbel_scale: 1.0

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 0
  save_interval_steps: 5
  directory: checkpoints/asd

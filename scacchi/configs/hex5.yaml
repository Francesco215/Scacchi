# From-scratch Hex5 numerical-Q21 trial.

defaults:
  - hex
  - _self_

run:
  max_num_iters: 40

env:
  board_size: 5

model:
  num_channels: 128
  num_layers: 8

selfplay:
  batch_size: 4096
  max_num_steps: 25

eval:
  checkpoint_path: checkpoints/5_solved

checkpointing:
  max_to_keep: 0
  save_interval_steps: 1
  directory: checkpoints/asd

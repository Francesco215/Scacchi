# @package _global_
# Policy-only evaluation, matching the lightweight PGX AlphaZero debug eval:
# both players act directly from masked policy logits and skip tree search.

eval:
  player_action_commitment:
    kind: posterior_sample
    posterior_update: null
  baseline_action_commitment:
    kind: posterior_sample
    posterior_update: null
  player_search:
    kind: policy
    policy:
      temperature: 1.0
  baseline_search:
    kind: policy
    policy:
      temperature: 1.0

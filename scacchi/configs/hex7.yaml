# From-scratch Hex7 native-categorical concentration-learning trial.

defaults:
  - hex
  - _self_

run:
  max_num_iters: 100

env:
  board_size: 7


selfplay:
  max_num_steps: 49

eval:
  checkpoint_path: checkpoints/7_solved

checkpointing:
  max_to_keep: 0
  save_interval_steps: 10
  directory: checkpoints/hex7_aznet_dirichlet_c128_l6_seed0

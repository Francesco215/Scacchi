# From-scratch Hex7 calibrated-posterior trial.
#
# The p32/e64 v2 checkpoint learned strong posterior means: when evaluated at
# the evidence scale learned by the fixed reference (C ~= 64), it scored 0.584
# over 4,096 official games versus i5wif2l3's final 0.577 rolling score.  Keep
# that efficient/diverse self-play recipe, use C64 in both training and eval,
# and train posterior means independently of fixed evidence mass.  This avoids
# both an eval-only calibration and the concentration-collapse failure of the
# earlier full-Dirichlet hard-floor trial.

run:
  seed: 0
  max_num_iters: 650

env:
  id: hex
  board_size: 7
  num_outcomes: 2

model:
  network: boardlaw_dirichlet
  num_channels: 256
  num_layers: 8
  compute_dtype: bfloat16
  resnet_v2: true
  dirichlet_concentration_floor: 64.0

selfplay:
  batch_size: 4096
  max_num_steps: 64
  action_commitment_type: posterior_argmax
  search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 64
      policy_samples: 32
      posterior_policy_samples: 32
      policy_sample_chunk_size: 32
      constants:
        kappa_leaf: 1.0
        kappa_terminal: 80.0
        categorical_epsilon: 0.01

training:
  batch_size: 1024
  learning_rate: 1e-3
  grad_clip_norm: 1.0
  losses:
    policy_weight: 1.0
    value_dir_kl_weight: 1.0
    q_dir_kl_weight: 1.0
    value_outcome_weight: 1.0
    q_outcome_weight: 1.0
    q_loss_weight_mode: evidence_mass
    q_dir_kl_reduction: masked_mean
    dirichlet_loss_mode: mean
    loss_mask_mode: value
    terminal_edge_targets: true
    terminal_parent_targets: true
    policy_target_mode: search
  regularization:
    dirichlet_concentration_clip: 100.0

eval:
  interval: 5
  batch_size: 1024
  baseline: checkpoint
  player_action_commitment_type: posterior_argmax
  baseline_action_commitment_type: search_action
  player_search:
    kind: dirichlet_thompson
    dirichlet_thompson:
      num_simulations: 128
      policy_samples: 256
      posterior_policy_samples: 32
      policy_sample_chunk_size: 32
      constants:
        kappa_leaf: 1.0
        kappa_terminal: 80.0
        categorical_epsilon: 0.01
  baseline_search:
    kind: gumbel
    gumbel:
      num_simulations: 32

logging:
  interval: 1
  wandb:
    enabled: true
    project: scacchi-az

checkpointing:
  max_to_keep: 1
  save_interval_steps: 10
  directory: checkpoints/hex7_speedrun_scratch_seed0_v4

env:
  id: chess

model:
  name: resnet
  channels: 64
  blocks: 4
  policy_channels: 2
  value_channels: 1
  value_hidden: 64
  resnet_v2: true
  batch_norm: true
  batch_norm_momentum: 0.9

optimizer:
  name: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  adam_weight_decay: 0.0

eval:
  enabled: true
  interval: 10
  batch_size: 4
  max_num_steps: 64

checkpoint:
  dir: checkpoints
  max_to_keep: 5
  save_interval_steps: 1000
  resume: true

runtime:
  name: single_mesh
  axis_name: data
  num_devices: 1

logging:
  wandb_enabled: false
  wandb_project: scacchi-az

train:
  seed: 0
  num_iters: 10_000
  selfplay_batch_size: 32
  max_num_steps: 16
  search:
    name: gumbel
    num_simulations: 16
    max_num_considered_actions: 16
    max_depth: null
    gumbel_scale: 1.0
  batch_size: 256
  minibatch_size: 64
  log_interval: 10

hydra:
  job:
    chdir: true

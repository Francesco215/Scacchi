<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 375" role="img" aria-labelledby="title description">
  <title id="title">One tree-search simulation</title>
  <desc id="description">Three panels show Thompson samples selecting a path down a partial tree, one new position being expanded and evaluated, and beliefs being updated along the same path from the new leaf back to the root.</desc>

  <defs>
    <marker id="orange-arrow" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L14 7L0 14Z" fill="#d97706"/>
    </marker>
    <marker id="blue-arrow" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L14 7L0 14Z" fill="#397f91"/>
    </marker>
    <style>
      .heading { fill: #31413d; font: 500 24px Seravek, Avenir, system-ui, sans-serif; }
      .stage { fill: #3f4945; font: 500 19px Seravek, Avenir, system-ui, sans-serif; }
      .label { fill: #65736e; font: 400 14px Seravek, Avenir, system-ui, sans-serif; }
      .sample { fill: #75817d; font: 400 13px Seravek, Avenir, system-ui, sans-serif; }
      .sample-selected { fill: #b46005; font: 500 14px Seravek, Avenir, system-ui, sans-serif; }
      .order { fill: #397f91; font: 500 14px Seravek, Avenir, system-ui, sans-serif; }
      .edge { fill: none; stroke: #b8c2be; stroke-linecap: round; stroke-width: 2; }
      .edge-selected { fill: none; stroke: #d97706; stroke-linecap: butt; stroke-width: 4; }
      .edge-update { fill: none; stroke: #397f91; stroke-linecap: butt; stroke-width: 4; }
      .node { fill: #f5f8f7; stroke: #8fa09a; stroke-width: 2; }
      .node-path { fill: #fff7ed; stroke: #d97706; stroke-width: 3; }
      .node-new { fill: #edf6f7; stroke: #397f91; stroke-width: 3; }
    </style>
  </defs>

  <text class="heading" x="42" y="34">One search simulation</text>
  <path d="M400 61V365M800 61V365" stroke="#dce3e0" stroke-width="1.5"/>

  <!-- Traverse -->
  <g transform="translate(0 0)">
    <text class="stage" x="200" y="75" text-anchor="middle">Traverse</text>
    <text class="label" x="200" y="98" text-anchor="middle">take a fresh Thompson sample</text>

    <path class="edge" d="M200 124L112 204M200 124L200 204M200 124L288 204"/>
    <path class="edge" d="M200 204L150 306M200 204L200 306M200 204L250 306"/>
    <path class="edge-selected" d="M200 139L200 173" marker-end="url(#orange-arrow)"/>
    <path class="edge-selected" d="M193.4 217.5L163.7 278.1" marker-end="url(#orange-arrow)"/>

    <circle class="node-path" cx="200" cy="124" r="15"/>
    <circle class="node" cx="112" cy="204" r="13"/>
    <circle class="node-path" cx="200" cy="204" r="15"/>
    <circle class="node" cx="288" cy="204" r="13"/>
    <circle cx="150" cy="306" r="14" fill="#fff" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4 4"/>
    <circle class="node" cx="200" cy="306" r="12"/>
    <circle class="node" cx="250" cy="306" r="12"/>

    <text class="sample" x="134" y="154">.31</text>
    <text class="sample-selected" x="208" y="164">.74</text>
    <text class="sample" x="270" y="154">.52</text>
    <text class="sample-selected" x="155" y="254">.68</text>
    <text class="sample" x="206" y="263">.35</text>
    <text class="sample" x="250" y="254">.20</text>
    <text class="label" x="150" y="342" text-anchor="middle">unexplored</text>
  </g>

  <!-- Expand -->
  <g transform="translate(400 0)">
    <text class="stage" x="200" y="75" text-anchor="middle">Expand</text>
    <text class="label" x="200" y="98" text-anchor="middle">add and evaluate one position</text>

    <path class="edge" d="M200 124L112 204M200 124L200 204M200 124L288 204"/>
    <path class="edge" d="M200 204L150 306M200 204L200 306M200 204L250 306"/>
    <path class="edge-selected" d="M200 139L200 189"/>
    <path class="edge-selected" d="M193.4 217.5L164.5 276.4" marker-end="url(#orange-arrow)"/>

    <circle class="node-path" cx="200" cy="124" r="15"/>
    <circle class="node" cx="112" cy="204" r="13"/>
    <circle class="node-path" cx="200" cy="204" r="15"/>
    <circle class="node" cx="288" cy="204" r="13"/>
    <circle class="node-new" cx="150" cy="306" r="16"/>
    <circle class="node" cx="200" cy="306" r="12"/>
    <circle class="node" cx="250" cy="306" r="12"/>

    <path d="M130 306H124" fill="none" stroke="#397f91" stroke-width="1.8" stroke-dasharray="4 4"/>
    <text class="label" x="116" y="302" text-anchor="end">network</text>
    <text class="label" x="116" y="320" text-anchor="end">evaluation</text>
  </g>

  <!-- Update beliefs -->
  <g transform="translate(800 0)">
    <text class="stage" x="200" y="75" text-anchor="middle">Update beliefs</text>
    <text class="label" x="200" y="98" text-anchor="middle">follow the same path upward</text>

    <path class="edge" d="M200 124L112 204M200 124L200 204M200 124L288 204"/>
    <path class="edge" d="M200 204L150 306M200 204L200 306M200 204L250 306"/>
    <path class="edge-update" d="M158.3 289.0L185.9 232.8" marker-end="url(#blue-arrow)"/>
    <path class="edge-update" d="M200 189L200 156" marker-end="url(#blue-arrow)"/>

    <circle class="node-new" cx="200" cy="124" r="15"/>
    <circle class="node" cx="112" cy="204" r="13"/>
    <circle class="node-new" cx="200" cy="204" r="15"/>
    <circle class="node" cx="288" cy="204" r="13"/>
    <circle class="node-new" cx="150" cy="306" r="16"/>
    <circle class="node" cx="200" cy="306" r="12"/>
    <circle class="node" cx="250" cy="306" r="12"/>

    <circle cx="183" cy="257" r="12" fill="#edf6f7" stroke="#397f91" stroke-width="1.5"/>
    <text class="order" x="183" y="262" text-anchor="middle">1</text>
    <circle cx="218" cy="165" r="12" fill="#edf6f7" stroke="#397f91" stroke-width="1.5"/>
    <text class="order" x="218" y="170" text-anchor="middle">2</text>
    <text class="label" x="200" y="351" text-anchor="middle">deepest node first</text>
  </g>

</svg>

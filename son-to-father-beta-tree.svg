<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title description">
  <title id="title">Three Go child positions contributing to a parent distribution</title>
  <desc id="description">A three-by-three Go position with a broad Beta distribution sits above three one-move child positions. From left to right, their value distributions are narrow and poor, narrow and strong, and broad and uncertain. Plain lines connect the children to the parent.</desc>


          <path d="M36 36H124M36 80H124M36 124H124"/>
          <path d="M36 36V124M80 36V124M124 36V124"/>
        </g>
        <circle cx="80" cy="80" r="2.2" fill="#2f2922" stroke="none"/>
        <circle cx="36" cy="36" r="14" fill="#2f2922"/>
        <circle cx="36" cy="124" r="14" fill="#2f2922"/>
        <circle cx="124" cy="36" r="14" fill="#fffdf8" stroke-width="1.4"/>
      </g>
      <path d="M16 132H144" fill="none" stroke="#aeb9b5" stroke-width="1.5"/>
    </g>
  </defs>


[project]
name = "Chess-in-Jax"
version = "0.1.0"
description = "A chess engine in Jax"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "dqaz",
    "einops",
    "jax[tpu]",
    "matplotlib",
    "tqdm",
    "wandb",
    "array-record>=0.8.3",
    "grain>=0.2.15",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "mctx ==0.0.6",
    "pgx>=2.6.0",
    "flax",
    "optax",
    "dm-haiku",
    "jaxtyping>=0.3.9",
    "ty>=0.0.32",
    "pytest>=9.0.3",
    "orbax-checkpoint>=0.11.36",
]

[project.scripts]
scacchi-train = "scacchi.train:main"

[tool.uv]
package = true

[tool.uv.sources]
dqaz = { path = "dqaz", editable = true }
optax = { git = "https://github.com/google-deepmind/optax.git" }
dm-haiku = { git = "https://github.com/google-deepmind/dm-haiku.git" }

[tool.setuptools]
package-dir = {"" = "."}

[project]
name = "Chess-in-Jax"
version = "0.1.0"
description = "A chess engine in Jax"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "einops",
    "jax[cuda13]",
    "matplotlib",
    "tqdm",
    "wandb",
    "array-record>=0.8.3",
    "grain>=0.2.15",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "mctx>=0.0.6",
    "pgx>=2.6.0",
    "flax>=0.12.7",
    "optax>=0.2.9.dev0",
    "jaxtyping>=0.3.9",
    "ty>=0.0.32",
    "pytest>=9.0.3",
    "orbax-checkpoint>=0.11.36",
]



[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
optax = { git = "https://github.com/google-deepmind/optax.git" }

[tool.setuptools]
package-dir = {"" = "."}
